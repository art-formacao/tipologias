name: Publicar aplicação no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar leitor de Excel
        run: npm install
      - name: Ler pastas, fotografias e Excel
        run: npm run generate
      - name: Remover dependências da publicação
        run: rm -rf node_modules
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar ficheiros
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
